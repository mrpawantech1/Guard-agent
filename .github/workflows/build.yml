name: Build Guard Agent APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # ⭐ PYTHON se decode + auto padding — bulletproof
      - name: Create google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 << 'PYEOF'
          import base64, os, json, sys
          
          b64 = os.environ.get('GS_B64', '')
          print(f"=== Secret length: {len(b64)} ===")
          print(f"First 50 chars: {b64[:50]}")
          print(f"Last 50 chars:  {b64[-50:]}")
          
          # Saari whitespace hatao
          cleaned = ''.join(b64.split())
          print(f"Cleaned length: {len(cleaned)}")
          
          if not cleaned:
              print("ERROR: Secret is EMPTY")
              sys.exit(1)
          
          # ⭐ Automatic padding add karo
          padding_needed = len(cleaned) % 4
          if padding_needed:
              cleaned += '=' * (4 - padding_needed)
              print(f"Added {4 - padding_needed} padding char(s)")
          
          try:
              data = base64.b64decode(cleaned, validate=True)
              print(f"Decoded: {len(data)} bytes")
          except Exception as e:
              print(f"BASE64 ERROR: {e}")
              sys.exit(1)
          
          with open('app/google-services.json', 'wb') as f:
              f.write(data)
          
          try:
              parsed = json.loads(data)
              print("VALID JSON ✓")
              print(f"Package: {parsed['client'][0]['client_info']['android_client_info']['package_name']}")
          except Exception as e:
              print(f"JSON ERROR: {e}")
              sys.exit(1)
          PYEOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guard-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
